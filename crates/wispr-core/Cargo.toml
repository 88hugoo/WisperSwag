[package]
name = "wispr-core"
description = "Núcleo multiplataforma de Wispr Swag: audio, motores de voz, procesamiento de texto, IA, ajustes e historial."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["local-stt", "capture"]
# Motor de reconocimiento local (sherpa-onnx, enlazado estáticamente).
local-stt = ["dep:sherpa-onnx"]
# Captura de micrófono con cpal (WASAPI en Windows).
capture = ["dep:cpal"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
once_cell.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "multipart", "stream", "http2", "system-proxy", "charset"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "7"
regex = "1"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
bzip2 = "0.6"
tar = { version = "0.4", default-features = false }
bitflags = { version = "2", features = ["serde"] }
cpal = { version = "0.18", optional = true }
sherpa-onnx = { version = "=1.13.8", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3"

[[example]]
name = "transcribe"
required-features = ["local-stt"]
