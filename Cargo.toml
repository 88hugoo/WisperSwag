[workspace]
resolver = "2"
members = ["crates/wispr-core", "crates/wispr-pill", "src-tauri"]
default-members = ["crates/wispr-core", "crates/wispr-pill", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Wispr Swag"]
publish = false
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
parking_lot = "0.12"
once_cell = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
