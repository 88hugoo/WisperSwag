[package]
name = "wispr-pill"
description = "Renderizado de la barra flotante de Wispr Swag (independiente de la plataforma)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
fontdue = "0.9"

[dev-dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
